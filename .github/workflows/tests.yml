name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The published mdzip-core and the newest MarkItDown, as users get them.
      # python-docx builds the Word file one test converts.
      - name: Install
        run: python -m pip install ".[docx,pptx,pdf]" python-docx
      - name: Test
        run: python -m unittest discover -s tests -t . -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build and check the package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the built wheel and use it
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/python -m pip install dist/*.whl
          /tmp/w/bin/python -c "import markitdown_mdzip; print(markitdown_mdzip.__version__)"
          /tmp/w/bin/markitdown-mdz --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
